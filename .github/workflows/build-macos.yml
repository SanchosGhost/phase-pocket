name: Build macOS VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phase-pocket-macos
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE 8.0.4
        run: |
          curl -fL https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-osx.zip -o juce.zip
          unzip -q juce.zip
      - name: Test actual DSP core
        run: |
          c++ -std=c++17 -O2 Tests/dsp_test.cpp -o dsp_test
          ./dsp_test
      - name: Configure universal build
        run: cmake -S . -B build -G Xcode -DJUCE_DIR="$PWD/JUCE" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --target PhasePocket_VST3
      - name: Sign and inspect
        run: |
          PLUGIN="build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3"
          codesign --force --deep --sign - "$PLUGIN"
          codesign --verify --deep --strict --verbose=2 "$PLUGIN"
          lipo -verify_arch arm64 x86_64 "$PLUGIN/Contents/MacOS/Phase Pocket"
      - name: Validate VST3 with pluginval
        run: |
          set -o pipefail
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$PWD/build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" 2>&1 | tee pluginval.log
      - name: Package validated plugin
        run: ditto -c -k --sequesterRsrc --keepParent "build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" PhasePocket-v0.2-macOS-Universal-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhasePocket-v0.2-macOS-Universal-VST3
          path: PhasePocket-v0.2-macOS-Universal-VST3.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log
          path: pluginval.log
          if-no-files-found: ignore
