name: Build macOS and Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phase-pocket-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE 8.0.4
        run: |
          curl -fL https://github.com/juce-framework/JUCE/releases/download/8.0.4/juce-8.0.4-osx.zip -o juce.zip
          unzip -q juce.zip
      - name: DSP regression tests
        run: |
          c++ -std=c++17 -O2 Tests/v07_test.cpp -o v07_test
          ./v07_test
      - name: Configure universal VST3
        run: cmake -S . -B build -G Xcode -DJUCE_DIR="$PWD/JUCE" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --target PhasePocket_VST3
      - name: Sign and inspect
        run: |
          PLUGIN="build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3"
          codesign --force --deep --sign - "$PLUGIN"
          codesign --verify --deep --strict --verbose=2 "$PLUGIN"
          lipo "$PLUGIN/Contents/MacOS/Phase Pocket" -verify_arch arm64 x86_64
      - name: Validate macOS VST3
        run: |
          set -o pipefail
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$PWD/build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" 2>&1 | tee pluginval-macos.log
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" PhasePocket-v0.7-macOS-Universal-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhasePocket-v0.7-macOS-Universal-VST3
          path: PhasePocket-v0.7-macOS-Universal-VST3.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-macos
          path: pluginval-macos.log
          if-no-files-found: ignore
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download JUCE 8.0.4 source
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.4.zip -OutFile juce.zip
          Expand-Archive juce.zip -DestinationPath juce-unpack
          Move-Item juce-unpack/JUCE-8.0.4 JUCE
      - name: Configure x64 build and tests
        run: cmake -S . -B build -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build VST3 and DSP tests
        run: cmake --build build --config Release --target PhasePocket_VST3 PocketV07Test
      - name: Run DSP tests
        shell: pwsh
        run: |
          & "./build/Release/PocketV07Test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows VST3
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-unpack
          $validator = (Get-ChildItem pluginval-unpack -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $validator) { throw "pluginval executable not found" }
          & $validator --strictness-level 5 --validate "$PWD/build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" 2>&1 | Tee-Object -FilePath pluginval-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/PhasePocket_artefacts/Release/VST3/Phase Pocket.vst3" -DestinationPath PhasePocket-v0.7-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhasePocket-v0.7-Windows-x64-VST3
          path: PhasePocket-v0.7-Windows-x64-VST3.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-log-windows
          path: pluginval-windows.log
          if-no-files-found: ignore
